<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEM — Sin conexión</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 2rem; text-align: center; background: #f7f7f5; }
    .card { max-width: 360px; padding: 1.5rem; border-radius: 12px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h1 { color: #2f6e3a; margin: 0 0 0.5rem; }
    p { color: #555; margin: 0; line-height: 1.4; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; border: 1px solid #2f6e3a; background: white; color: #2f6e3a; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>NEM</h1>
    <p>Sin conexión a internet. Los cambios que hagas se guardarán y se sincronizarán al reconectar.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
